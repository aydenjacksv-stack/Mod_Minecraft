name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "FPS Boost Mod ${{ steps.tag.outputs.TAG }}"
          body: |
            ## FPS Boost Mod ${{ steps.tag.outputs.TAG }}

            Mod Minecraft Fabric qui améliore les FPS via :
            - **Entity Culling** — ne rend pas les entités hors du champ de vision
            - **Particle Limiter** — limite le nombre de particules simultanées
            - **Fog Optimizer** — recalcule le brouillard 1 frame sur 4
            - **Chunk Throttle** — limite les rebuilds de chunks par frame

            ### Installation
            1. Installer [Fabric Loader](https://fabricmc.net/use/) pour Minecraft 1.20.1
            2. Télécharger `fpsboost-${{ steps.tag.outputs.TAG }}.jar` ci-dessous
            3. Placer le jar dans `.minecraft/mods/`
            4. Lancer Minecraft avec le profil Fabric
          files: build/libs/fpsboost-*.jar
          draft: false
          prerelease: false
